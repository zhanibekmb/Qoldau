name: PostgreSQL migration and API tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qoldau_test
          POSTGRES_USER: qoldau
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qoldau -d qoldau_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      QOLDAU_DATABASE_URL: postgresql+psycopg://qoldau:test-only-password@127.0.0.1:5432/qoldau_test
      QOLDAU_SCHEDULER_ENABLED: "false"
      QOLDAU_JOBS_INLINE: "true"
      QOLDAU_UPLOAD_DIR: /tmp/qoldau-test-uploads
      QOLDAU_EXPORT_DIR: /tmp/qoldau-test-exports
      QOLDAU_MODEL_DIR: /tmp/qoldau-test-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Apply migrations on PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Run API suite on PostgreSQL
        run: pytest backend/tests -q
