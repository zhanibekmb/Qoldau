name: Browser end-to-end

on:
  pull_request:
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QOLDAU_DATABASE_URL: sqlite:////tmp/qoldau-e2e.db
      QOLDAU_SCHEDULER_ENABLED: "false"
      QOLDAU_JOBS_INLINE: "true"
      QOLDAU_PILOT_DIRECTORY_PUBLISHED: "true"
      QOLDAU_ATTACHMENT_MODE: "disabled"
      QOLDAU_UPLOAD_DIR: /tmp/qoldau-e2e-uploads
      QOLDAU_EXPORT_DIR: /tmp/qoldau-e2e-exports
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      E2E_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Seed isolated test database
        working-directory: backend
        run: python -m app.seed --reset --demo
      - name: Start backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/qoldau-backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          cat /tmp/qoldau-backend.log
          exit 1
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start > /tmp/qoldau-frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/login && exit 0; sleep 2; done
          cat /tmp/qoldau-frontend.log
          exit 1
      - name: Run browser scenarios
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results
            frontend/playwright-report
