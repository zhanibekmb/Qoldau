services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qoldau
      POSTGRES_USER: qoldau
      POSTGRES_PASSWORD: qoldau
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qoldau"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      QOLDAU_DATABASE_URL: postgresql+psycopg://qoldau:qoldau@db:5432/qoldau
      QOLDAU_SECRET_KEY: ${QOLDAU_SECRET_KEY:-change-me-in-production-please-32-bytes-min}
      QOLDAU_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes: [uploads:/app/uploads, exports:/app/exports, models:/app/app/ml/artifacts]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  uploads:
  exports:
  models:
