services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qoldau
      POSTGRES_USER: qoldau
      POSTGRES_PASSWORD: ${QOLDAU_DB_PASSWORD:?Set QOLDAU_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qoldau -d qoldau"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    environment:
      QOLDAU_ENVIRONMENT: production
      QOLDAU_DATABASE_URL: ${QOLDAU_DATABASE_URL:?Set QOLDAU_DATABASE_URL}
      QOLDAU_SECRET_KEY: ${QOLDAU_SECRET_KEY:?Set QOLDAU_SECRET_KEY}
      QOLDAU_CORS_ORIGINS: '["https://${QOLDAU_DOMAIN:?Set QOLDAU_DOMAIN}"]'
      QOLDAU_UPLOAD_DIR: /app/uploads
      QOLDAU_EXPORT_DIR: /app/exports
      QOLDAU_MODEL_DIR: /app/app/ml/artifacts
    volumes:
      - uploads:/app/uploads
      - exports:/app/exports
      - models:/app/app/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${QOLDAU_DOMAIN:?Set QOLDAU_DOMAIN}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      QOLDAU_DOMAIN: ${QOLDAU_DOMAIN:?Set QOLDAU_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  uploads:
  exports:
  models:
  caddy_data:
  caddy_config:
